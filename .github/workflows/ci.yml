name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, typecheck, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend tooling
        run: python -m pip install --upgrade pip uv

      - name: Check backend formatting
        run: uv run --extra dev ruff format --check app tests

      - name: Lint backend
        run: uv run --extra dev ruff check app tests

      - name: Typecheck backend
        run: uv run --extra dev mypy app

      - name: Test backend
        run: uv run --extra dev pytest -q

  frontend:
    name: Frontend lint, typecheck, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
