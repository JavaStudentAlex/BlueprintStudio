name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router:
    name: Diff Router
    runs-on: ubuntu-latest
    outputs:
      run_backend: ${{ steps.diff.outputs.run_backend }}
      run_frontend: ${{ steps.diff.outputs.run_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine what changed
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            BASE_SHA="${GITHUB_BASE_REF:-}"
            HEAD_SHA="${GITHUB_SHA:-}"
            git fetch origin "${BASE_SHA}" --depth=1
          else
            BASE_SHA="${BEFORE_SHA:-}"
            HEAD_SHA="${GITHUB_SHA:-}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || printf '%s' "$HEAD_SHA")"
            fi
          fi
          
          RUN_BACKEND=false
          RUN_FRONTEND=false
          
          while IFS= read -r path; do
            if [[ "$path" == .github/workflows/* ]] || [[ "$path" == "docker-compose.yml" ]] || [[ "$path" == "Makefile" ]]; then
              RUN_BACKEND=true
              RUN_FRONTEND=true
              break
            fi
            if [[ "$path" == backend/* ]]; then
              RUN_BACKEND=true
            fi
            if [[ "$path" == frontend/* ]]; then
              RUN_FRONTEND=true
            fi
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || git diff --name-only HEAD~1 HEAD)
          
          echo "run_backend=$RUN_BACKEND" >> "$GITHUB_OUTPUT"
          echo "run_frontend=$RUN_FRONTEND" >> "$GITHUB_OUTPUT"

  pr-template:
    name: Check PR Template
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR Body
        run: |
          cat << 'PR_BODY_EOF' > pr_body.txt
          ${{ github.event.pull_request.body }}
          PR_BODY_EOF
          
          python3 -c '
          import sys, re
          with open("pr_body.txt", "r") as f:
              body = f.read()
          errors = []
          for section in ["## What", "## Why", "## How tested"]:
              if section not in body:
                  errors.append(f"Missing required section: {section}")
          checkboxes = [
              r"- \[[xX]\] I have filled in all required sections above",
              r"- \[[xX]\] The branch name follows the naming convention",
              r"- \[[xX]\] This PR is not self-merged"
          ]
          for i, pattern in enumerate(checkboxes):
              if not re.search(pattern, body):
                  errors.append(f"Checkbox {i+1} is not checked or is missing.")
          if errors:
              for err in errors: print(f"::error::{err}")
              sys.exit(1)
          print("PR template validation passed.")
          '

  backend:
    name: Backend validation
    needs: router
    if: needs.router.outputs.run_backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend tooling
        run: python -m pip install --upgrade pip uv

      - name: Check backend formatting
        run: uv run --extra dev ruff format --check app tests

      - name: Lint backend
        run: uv run --extra dev ruff check app tests

      - name: Typecheck backend
        run: uv run --extra dev mypy app

      - name: Test backend
        run: uv run --extra dev pytest -q

  frontend:
    name: Frontend validation
    needs: router
    if: needs.router.outputs.run_frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Test frontend (Unit)
        run: npm test

      - name: Build frontend
        run: npm run build

  e2e:
    name: E2E Playwright Tests
    needs: [backend, frontend]
    if: success() && (needs.router.outputs.run_frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npm run e2e:install

      - name: Start docker compose application
        run: make up

      - name: Wait for services
        run: |
          echo "Waiting for backend on port 8000..."
          timeout 30 bash -c 'while ! curl -s http://localhost:8000/health > /dev/null; do sleep 1; done'
          echo "Waiting for frontend on port 3000..."
          timeout 60 bash -c 'while ! curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
          
      - name: Test frontend (E2E)
        working-directory: frontend
        run: npm run e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Teardown
        if: always()
        run: make logs && make down
