name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router:
    name: Diff Router
    runs-on: ubuntu-latest
    outputs:
      run_backend: ${{ steps.diff.outputs.run_backend }}
      run_frontend: ${{ steps.diff.outputs.run_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine what changed
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: ./scripts/diff_router.sh

  pr-template:
    name: Check PR Template
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR Body
        env:
          PR_BODY_FILE: pr_body.txt
        run: |
          cat << 'PR_BODY_EOF' > pr_body.txt
          ${{ github.event.pull_request.body }}
          PR_BODY_EOF
          python3 scripts/pr_template_check.py

  backend:
    name: Backend validation
    needs: router
    if: needs.router.outputs.run_backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend tooling
        run: python -m pip install --upgrade pip uv

      - name: Check backend formatting
        run: uv run --extra dev ruff format --check app tests

      - name: Lint backend
        run: uv run --extra dev ruff check app tests

      - name: Typecheck backend
        run: uv run --extra dev mypy app

      - name: Test backend
        run: uv run --extra dev pytest -q

  frontend:
    name: Frontend validation
    needs: router
    if: needs.router.outputs.run_frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Test frontend (Unit)
        run: npm test

      - name: Build frontend
        run: npm run build

  e2e:
    name: E2E Playwright Tests
    needs: [backend, frontend]
    if: success() && (needs.router.outputs.run_frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npm run e2e:install

      - name: Start docker compose application
        run: make up

      - name: Wait for services
        run: |
          echo "Waiting for backend on port 8000..."
          timeout 30 bash -c 'while ! curl -s http://localhost:8000/health > /dev/null; do sleep 1; done'
          echo "Waiting for frontend on port 3000..."
          timeout 60 bash -c 'while ! curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
          
      - name: Test frontend (E2E)
        working-directory: frontend
        run: npm run e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Teardown
        if: always()
        run: make logs && make down
