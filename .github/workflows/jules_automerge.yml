name: 1. Auto-Validate and Merge Jules PRs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jules-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gsd-planning:
    name: GSD planning validation
    runs-on: ubuntu-latest
    if: >-
      ${{
        !github.event.pull_request.draft &&
        (
          github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
          github.event.pull_request.user.login == 'google-jules[bot]' ||
          github.event.pull_request.user.login == github.repository_owner ||
          contains(github.event.pull_request.labels.*.name, 'jules') ||
          contains(github.event.pull_request.labels.*.name, 'automerge')
        )
      }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate GSD task queue
        run: python scripts/gsd_task_bridge.py validate .planning/todos/AGENT-TASKS.md

      - name: Guard against legacy planning surfaces
        run: |
          violations=0

          for path in \
            agent_tasks.json \
            backlog.md \
            docs/product_direction.md \
            docs/flowdraft_integration_research.md \
            docs/jules_autonomous_loop.md \
            docs/codex_worker_plan.md \
            docs/ideas.md \
            scripts/validate_agent_tasks.py
          do
            if [ -e "$path" ]; then
              echo "::error file=${path}::Legacy planning surface must not be recreated. Use .planning/ instead."
              violations=1
            fi
          done

          exit "$violations"

  router:
    name: Diff Router
    runs-on: ubuntu-latest
    outputs:
      run_backend: ${{ steps.diff.outputs.run_backend }}
      run_frontend: ${{ steps.diff.outputs.run_frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine what changed
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: ./scripts/diff_router.sh

  pr-template:
    name: Check PR Template
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR Body
        env:
          PR_BODY_FILE: pr_body.txt
        run: |
          cat << 'PR_BODY_EOF' > pr_body.txt
          ${{ github.event.pull_request.body }}
          PR_BODY_EOF
          python3 scripts/pr_template_check.py

  backend:
    name: Backend validation
    needs: router
    if: needs.router.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend tooling
        run: python -m pip install --upgrade pip uv

      - name: Check backend formatting
        run: uv run --extra dev ruff format --check app tests

      - name: Lint backend
        run: uv run --extra dev ruff check app tests

      - name: Typecheck backend
        run: uv run --extra dev mypy app

      - name: Test backend
        run: uv run --extra dev pytest -q

  frontend:
    name: Frontend validation
    needs: router
    if: needs.router.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Test frontend (Unit)
        run: npm test

      - name: Build frontend
        run: npm run build

  e2e:
    name: E2E Playwright Tests
    needs: [backend, frontend, router]
    if: success() && needs.router.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npm run e2e:install

      - name: Start docker compose application
        run: make up

      - name: Wait for services
        run: |
          echo "Waiting for backend on port 8000..."
          timeout 30 bash -c 'while ! curl -s http://localhost:8000/health > /dev/null; do sleep 1; done'
          echo "Waiting for frontend on port 3000..."
          timeout 60 bash -c 'while ! curl -s http://localhost:3000 > /dev/null; do sleep 1; done'
          
      - name: Test frontend (E2E)
        working-directory: frontend
        run: npm run e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Teardown
        if: always()
        run: make logs && make down

  merge:
    name: Merge validated PR
    runs-on: ubuntu-latest
    needs: [gsd-planning, pr-template, backend, frontend, e2e, router]
    if: >-
      always() &&
      needs.gsd-planning.result == 'success' &&
      needs.pr-template.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      !github.event.pull_request.draft &&
      (
        github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
        github.event.pull_request.user.login == 'google-jules[bot]' ||
        github.event.pull_request.user.login == github.repository_owner ||
        contains(github.event.pull_request.labels.*.name, 'jules') ||
        contains(github.event.pull_request.labels.*.name, 'automerge')
      )

    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_ACCESS_TOKEN secret is required for Jules auto-merge."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --merge \
            --delete-branch
