name: 1. Auto-Validate and Merge Jules PRs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jules-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-merge:
    name: Validate and Auto-Merge
    runs-on: ubuntu-latest
    if: >-
      ${{
        !github.event.pull_request.draft &&
        (
          github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
          github.event.pull_request.user.login == 'google-jules[bot]' ||
          github.event.pull_request.user.login == github.repository_owner ||
          contains(github.event.pull_request.labels.*.name, 'jules') ||
          contains(github.event.pull_request.labels.*.name, 'automerge')
        )
      }}
    steps:
      - uses: actions/checkout@v4

      - name: Auto-merge Jules PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Validating PR before merge..."
          # Standard validation can happen here (e.g. waiting for CI to pass)
          # GitHub branch protection rules typically handle requiring status checks.
          
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto --repo ${{ github.repository }}
