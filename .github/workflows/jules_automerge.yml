name: 1. Auto-Validate and Merge Jules PRs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jules-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && (github.event.pull_request.user.login == 'google-labs-jules[bot]' || github.event.pull_request.user.login == 'google-jules[bot]' || github.event.pull_request.user.login == github.repository_owner || contains(github.event.pull_request.labels.*.name, 'jules') || contains(github.event.pull_request.labels.*.name, 'automerge')) }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend tooling
        run: python -m pip install --upgrade pip uv

      - name: Check backend formatting
        run: uv run --extra dev ruff format --check app tests

      - name: Lint backend
        run: uv run --extra dev ruff check app tests

      - name: Typecheck backend
        run: uv run --extra dev mypy app

      - name: Test backend
        run: uv run --extra dev pytest -q

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && (github.event.pull_request.user.login == 'google-labs-jules[bot]' || github.event.pull_request.user.login == 'google-jules[bot]' || github.event.pull_request.user.login == github.repository_owner || contains(github.event.pull_request.labels.*.name, 'jules') || contains(github.event.pull_request.labels.*.name, 'automerge')) }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  merge:
    name: Merge validated PR
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ !github.event.pull_request.draft && (github.event.pull_request.user.login == 'google-labs-jules[bot]' || github.event.pull_request.user.login == 'google-jules[bot]' || github.event.pull_request.user.login == github.repository_owner || contains(github.event.pull_request.labels.*.name, 'jules') || contains(github.event.pull_request.labels.*.name, 'automerge')) }}

    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_ACCESS_TOKEN secret is required for Jules auto-merge."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --merge \
            --delete-branch
