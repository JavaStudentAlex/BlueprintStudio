name: 2. Trigger Next Jules Task

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jules-next-task-main
  cancel-in-progress: false

jobs:
  next-task:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && (github.event.pull_request.user.login == 'google-labs-jules[bot]' || github.event.pull_request.user.login == 'google-jules[bot]' || contains(github.event.pull_request.labels.*.name, 'jules') || contains(github.event.pull_request.labels.*.name, 'automerge'))) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate task manifest
        run: python scripts/validate_agent_tasks.py agent_tasks.json

      - name: Select next safe task
        id: task
        run: |
          TASK_JSON=$(jq -cr '[.tasks[] | select(.status == "todo" and (.risk == "low" or .risk == "medium")) | select(has("review_required") | not)][0] // empty' agent_tasks.json)

          if [ -z "$TASK_JSON" ]; then
            echo "No low/medium todo task without review_required found."
            exit 1
          fi

          TASK_ID=$(printf '%s' "$TASK_JSON" | jq -r '.id')
          echo "Selected task: ${TASK_ID}"

          {
            echo "task_id=${TASK_ID}"
            echo "task_json<<EOF"
            printf '%s\n' "$TASK_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Trigger Google Jules via official API
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_1_API_KEY: ${{ secrets.JULES_1_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          TASK_ID: ${{ steps.task.outputs.task_id }}
          SELECTED_TASK: ${{ steps.task.outputs.task_json }}
        run: |
          if [ -z "$JULES_API_KEY" ] && [ -z "$JULES_1_API_KEY" ]; then
            echo "At least one Jules API key secret is required: JULES_API_KEY or JULES_1_API_KEY."
            exit 1
          fi

          PROMPT=$(cat <<'EOF'
          You are working on BlueprintStudio, a construction-analysis application with a FastAPI/LangGraph backend and a Next.js frontend.

          MANDATORY ORDER:
          1. Read AGENTS.md first. Treat it as the repository contract.
          2. Validate and inspect agent_tasks.json.
          3. Read docs/product_direction.md, docs/jules_autonomous_loop.md, docs/flowdraft_integration_research.md, docs/codex_worker_plan.md, backlog.md, and docs/ideas.md only as needed for the selected task.
          4. Work on exactly one task ID.
          5. Use the selected task from agent_tasks.json below unless it is already done or genuinely blocked on current main. If blocked, choose the next low/medium-risk todo task without review_required and explain the switch in the PR.
          6. Stay within the task's allowed_paths. Do not modify .github/workflows/**, secrets, deployment files, or dependency manifests unless the selected task explicitly allows it.
          7. Implement the task's acceptance criteria. Add or update tests when behavior changes.
          8. Never call real external LLMs, standards sites, government sites, paid APIs, or third-party services from tests; use mocks, fakes, or fixtures.
          9. Update agent_tasks.json in the PR: mark the selected task done only when acceptance criteria are met; otherwise leave it todo or mark it blocked with a concise reason.
          10. Before opening the PR, run the relevant checks:
             - backend: uv run --extra dev ruff format --check app tests; uv run --extra dev ruff check app tests; uv run --extra dev mypy app; uv run --extra dev pytest -q
             - frontend: npm run lint; npx tsc --noEmit; npm test; npm run build
          11. If both backend and frontend are touched, run both check groups.
          12. Open one pull request against main with the task ID in the title, a concise summary, and the checks you actually ran.
          EOF
          )

          PROMPT="${PROMPT}

          SELECTED TASK FROM agent_tasks.json:
          ${SELECTED_TASK}
          "

          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "sources/github/${REPOSITORY}" \
            --arg title "BlueprintStudio: ${TASK_ID}" \
            '{
              "prompt": $prompt,
              "sourceContext": {
                "source": $source,
                "githubRepoContext": {"startingBranch": "main"}
              },
              "automationMode": "AUTO_CREATE_PR",
              "title": $title
            }')

          trigger_jules() {
            local key_name="$1"
            local api_key="$2"

            if [ -z "$api_key" ]; then
              echo "Skipping ${key_name}; secret is not configured."
              return 2
            fi

            echo "Triggering Jules with ${key_name}."
            curl --fail --silent --show-error 'https://jules.googleapis.com/v1alpha/sessions' \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Goog-Api-Key: ${api_key}" \
              -d "$PAYLOAD"
          }

          if [ $((RUN_NUMBER % 2)) -eq 0 ]; then
            PRIMARY_NAME="JULES_API_KEY"
            PRIMARY_KEY="$JULES_API_KEY"
            FALLBACK_NAME="JULES_1_API_KEY"
            FALLBACK_KEY="$JULES_1_API_KEY"
          else
            PRIMARY_NAME="JULES_1_API_KEY"
            PRIMARY_KEY="$JULES_1_API_KEY"
            FALLBACK_NAME="JULES_API_KEY"
            FALLBACK_KEY="$JULES_API_KEY"
          fi

          if trigger_jules "$PRIMARY_NAME" "$PRIMARY_KEY"; then
            exit 0
          fi

          echo "Primary Jules key path failed; retrying once with ${FALLBACK_NAME}."
          trigger_jules "$FALLBACK_NAME" "$FALLBACK_KEY"
