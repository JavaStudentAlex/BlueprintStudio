name: 2. Trigger Next Jules Task

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jules-next-task-main
  cancel-in-progress: false

jobs:
  next-task:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.merged == true &&
          (
            github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
            github.event.pull_request.user.login == 'google-jules[bot]' ||
            github.event.pull_request.user.login == github.repository_owner ||
            contains(github.event.pull_request.labels.*.name, 'jules') ||
            contains(github.event.pull_request.labels.*.name, 'automerge')
          )
        )
      }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate GSD task queue
        run: python scripts/gsd_task_bridge.py validate .planning/todos/AGENT-TASKS.md

      - name: Select next safe GSD task
        id: task
        run: python scripts/gsd_task_bridge.py next .planning/todos/AGENT-TASKS.md --github-output "$GITHUB_OUTPUT"

      - name: Trigger Google Jules via official API
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_1_API_KEY: ${{ secrets.JULES_1_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          TASK_ID: ${{ steps.task.outputs.task_id }}
          SELECTED_TASK: ${{ steps.task.outputs.task_json }}
          TASK_PROMPT: ${{ steps.task.outputs.task_prompt }}
        run: |
          if [ -z "$JULES_API_KEY" ] && [ -z "$JULES_1_API_KEY" ]; then
            echo "At least one Jules API key secret is required: JULES_API_KEY or JULES_1_API_KEY."
            exit 1
          fi

          PROMPT=$(cat <<'EOF'
          You are working on BlueprintStudio, a construction-analysis application with a FastAPI/LangGraph backend and a Next.js frontend.

          MANDATORY GSD ORDER:
          1. Read AGENTS.md first. Treat it as the repository contract.
          2. Read .planning/STATE.md, .planning/PROJECT.md, .planning/REQUIREMENTS.md, .planning/ROADMAP.md, and .planning/todos/AGENT-TASKS.md.
          3. Inspect relevant source files, tests, and .planning/codebase/ notes.
          4. Prefer native GSD workflow commands if the environment exposes them. If not, manually follow Discuss -> Plan -> Execute -> Verify -> Ship.
          5. Work on exactly one GSD task ID.
          6. Use the selected task from .planning/todos/AGENT-TASKS.md below unless it is already done or genuinely blocked on current main.
          7. If blocked, choose the next low/medium-risk todo task, explain the switch in the PR, and update .planning/todos/AGENT-TASKS.md.
          8. Stay within the task scope unless the GSD phase plan explicitly expands it.
          9. Do not recreate agent_tasks.json or legacy Jules/Codex planning files.
          10. Do not modify .github/workflows/**, secrets, deployment files, or dependency manifests unless the selected task explicitly allows it.
          11. Implement the task acceptance criteria. Add or update tests when behavior changes.
          12. Never call real external LLMs, standards sites, government sites, paid APIs, or third-party services from tests; use mocks, fakes, or fixtures.
          13. Update .planning/STATE.md, .planning/todos/AGENT-TASKS.md, and verification notes in the PR.
          14. Before opening the PR, run the relevant checks:
              - backend: uv run --extra dev ruff format --check app tests; uv run --extra dev ruff check app tests; uv run --extra dev mypy app; uv run --extra dev pytest -q
              - frontend: npm run lint; npx tsc --noEmit; npm test; npm run build
          15. If both backend and frontend are touched, run both check groups.
          16. Open one pull request against main with the task ID in the title, a concise summary, and the checks you actually ran.
          EOF
          )

          PROMPT="${PROMPT}

          SELECTED TASK FROM .planning/todos/AGENT-TASKS.md:
          ${SELECTED_TASK}

          FOCUSED GSD TASK PROMPT:
          ${TASK_PROMPT}
          "

          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "sources/github/${REPOSITORY}" \
            --arg title "BlueprintStudio GSD: ${TASK_ID}" \
            '{
              "prompt": $prompt,
              "sourceContext": {
                "source": $source,
                "githubRepoContext": {"startingBranch": "main"}
              },
              "automationMode": "AUTO_CREATE_PR",
              "title": $title
            }')

          trigger_jules() {
            local key_name="$1"
            local api_key="$2"

            if [ -z "$api_key" ]; then
              echo "Skipping ${key_name}; secret is not configured."
              return 2
            fi

            echo "Triggering Jules with ${key_name}."
            curl --fail --silent --show-error 'https://jules.googleapis.com/v1alpha/sessions' \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Goog-Api-Key: ${api_key}" \
              -d "$PAYLOAD"
          }

          if [ $((RUN_NUMBER % 2)) -eq 0 ]; then
            PRIMARY_NAME="JULES_API_KEY"
            PRIMARY_KEY="$JULES_API_KEY"
            FALLBACK_NAME="JULES_1_API_KEY"
            FALLBACK_KEY="$JULES_1_API_KEY"
          else
            PRIMARY_NAME="JULES_1_API_KEY"
            PRIMARY_KEY="$JULES_1_API_KEY"
            FALLBACK_NAME="JULES_API_KEY"
            FALLBACK_KEY="$JULES_API_KEY"
          fi

          if trigger_jules "$PRIMARY_NAME" "$PRIMARY_KEY"; then
            exit 0
          fi

          echo "Primary Jules key path failed; retrying once with ${FALLBACK_NAME}."
          trigger_jules "$FALLBACK_NAME" "$FALLBACK_KEY"
