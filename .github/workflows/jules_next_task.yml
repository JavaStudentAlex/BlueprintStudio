name: 2. Trigger Next Jules Task

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jules-next-task-main
  cancel-in-progress: false

jobs:
  next-task:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.merged == true &&
          (
            github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
            github.event.pull_request.user.login == 'google-jules[bot]' ||
            github.event.pull_request.user.login == github.repository_owner ||
            contains(github.event.pull_request.labels.*.name, 'jules') ||
            contains(github.event.pull_request.labels.*.name, 'automerge')
          )
        )
      }}

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Google Jules via official API
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${JULES_API_KEY}" ]; then
            echo "JULES_API_KEY secret is not configured. Skipping trigger."
            exit 0
          fi
          
          # We extract the latest project constraints and context to feed into Jules
          GSD_STATE=""
          if [ -d ".gsd" ]; then
             GSD_STATE="The project context is defined in the .gsd/ directory. Check .gsd/PROJECT.md, .gsd/REQUIREMENTS.md, and .gsd/DECISIONS.md to understand constraints. Review .gsd/QUEUE.md and the latest incomplete milestone in .gsd/milestones/ for the next available task. DO NOT edit or modify files in the .gsd/ directory; treat it as read-only context."
          else
             GSD_STATE="No .gsd/ directory found. Please analyze the repository codebase independently to figure out the next logical task or fix."
          fi

          echo "Triggering Google Jules for repository ${REPOSITORY}..."
          
          curl -X POST "https://api.jules.app/v1/trigger" \
            -H "Authorization: Bearer ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @- <<PAYLOAD
          {
            "repository": "${REPOSITORY}",
            "prompt": "Please act as an autonomous agent. Evaluate the repository state to pick up the next task. ${GSD_STATE}\n\nFollow your internal workflow of planning, implementation, testing, and shipping. Open exactly one Pull Request when done, detailing what was fixed or implemented."
          }
          PAYLOAD
